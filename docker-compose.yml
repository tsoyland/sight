# Local development dependencies. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sight
      POSTGRES_PASSWORD: sight
      POSTGRES_DB: sight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sight"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
